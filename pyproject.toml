[project]
name = "mai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "buriburiyj", email = "194024832+buriburiyj@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ag-ui-protocol>=0.1.22",
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "mcp[cli]>=2.2.0",
    "platformdirs>=4.11.8",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "textual[syntax]>=8.2.8",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
mai = "mai:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.6",
]
